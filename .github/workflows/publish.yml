name: Publish

# Push a tag such as v0.1.0 (matching the version in pyproject.toml and
# server.json) to publish to PyPI and then the MCP Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check versions match the tag
        run: python scripts/check_version.py "$GITHUB_REF"
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/msproject-mcp-server/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # MCP Registry GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        # PyPI can take a minute to serve a new release; retry while the
        # registry's package validation catches up.
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
